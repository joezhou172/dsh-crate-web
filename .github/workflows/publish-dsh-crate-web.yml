name: 手动发布 DSH Crate Preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: 已完成本机验收的 Preview 版本
        required: true
        type: string
      sha256:
        description: 已验收 tgz 的 SHA-256
        required: true
        type: string
      publish:
        description: 实际发布；关闭时仅校验
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: crate-npm-manual-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 校验输入并下载已验收的预发布制品
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          python -m unittest discover -s tests -p test_manual_release.py
          python scripts/manual-release.py inputs
          mkdir -p release
          gh release download "v${RELEASE_VERSION}" --pattern "dsh-crate-web-${RELEASE_VERSION}.tgz" --dir release
          python scripts/manual-release.py audit
      - name: 在空环境普通安装最终制品
        run: |
          mkdir -p work
          node scripts/release_consumer.mjs "$(node -p "'release/' + JSON.parse(require('fs').readFileSync('release/audit.json')).filename")" work/clean-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: checked-preview
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: checked-preview
          path: release
      - name: 使用可信发布，仅更新 preview 标签
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: node scripts/npm-release.mjs release
      - name: 下载注册表制品并核对发布前哈希
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: node scripts/verify-published-release.mjs
