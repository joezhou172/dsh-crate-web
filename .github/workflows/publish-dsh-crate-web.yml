name: Publish DSH Crate Web to npm

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "core/**"
      - "lib/**"
      - "skills/**"
      - "runtime/**"
      - "package.json"
      - "cordis.patch.yml"
      - "*.mjs"
      - "README*"
      - "scripts/release_*.py"
      - "scripts/release_consumer.mjs"
      - "scripts/npm-release.mjs"
      - "tests/test_release*.py"
      - ".github/workflows/publish-dsh-crate-web.yml"
  pull_request:
    paths:
      - "src/**"
      - "core/**"
      - "lib/**"
      - "skills/**"
      - "runtime/**"
      - "package.json"
      - "cordis.patch.yml"
      - "*.mjs"
      - "README*"
      - "scripts/release_*.py"
      - "scripts/release_consumer.mjs"
      - "scripts/npm-release.mjs"
      - "tests/test_release*.py"
      - ".github/workflows/publish-dsh-crate-web.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "实际发布 Preview；关闭时只检查和上传检查制品"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crate-npm-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  validate-package:
    name: 检查隐私与最终 npm 制品
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 校验发布规则
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/release_policy.py
          python scripts/generate-skill-reference.py
          git diff --exit-code -- skills/
          python scripts/test-local.py --pattern 'test_release*.py'
          python scripts/test-local.py -- python skills/dsh-crate-troubleshooting/tests/run_tests.py
      - name: 扫描实际提交；命中只报告位置
        run: python scripts/release_guard.py git --revision HEAD
      - name: 生成并检查唯一发布制品
        id: package
        run: |
          mkdir release
          npm pack . --ignore-scripts --json --pack-destination ./release > release/npm-pack.json
          python scripts/release_policy.py --pack-report release/npm-pack.json --output release/audit.json --github-output "$GITHUB_OUTPUT"
      - name: 最终 tgz 必须可在空环境普通安装
        run: |
          node scripts/release_consumer.mjs "$(node -p "'release/' + JSON.parse(require('fs').readFileSync('release/audit.json', 'utf8')).filename")" work/clean-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: crate-npm-preview
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: 保存测试结果与资源观测
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crate-release-test-observations
          path: |
            work/test-observations/
            work/clean-consumer/report.json
            work/clean-consumer/stdout.log
            work/clean-consumer/stderr.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: 发布经过检查的 Preview
    needs: validate-package
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: crate-npm-preview
          path: release
      - name: 校验哈希并使用 OIDC 发布；已存在的相同制品跳过
        env:
          EXPECTED_SHA256: ${{ needs.validate-package.outputs.sha256 }}
          # 私有仓库不支持 npm provenance；这不关闭 OIDC 身份认证。
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: node scripts/npm-release.mjs release
